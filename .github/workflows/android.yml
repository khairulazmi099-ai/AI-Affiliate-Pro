
name: Build AI Affiliate Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI_Affiliate_Pro_V2_Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip AI_Affiliate_Pro_V2_Source.zip -d source
          echo "PROJECT_DIR=source/AI_Affiliate_Pro_V2" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Affiliate-Pro-APK
          path: source/AI_Affiliate_Pro_V2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
